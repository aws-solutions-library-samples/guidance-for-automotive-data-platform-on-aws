[pytest]
markers =
    needs_curated: tests that require Group 3 generators to have written curated/ parquet
    needs_dimensions: tests that require Group 2 dimension generator to have written dimensions/ parquet
    slow: heavy full-data tests (e.g. 5M-row FK-closure over ~85M product rows); deselect in inner-loop runs with `-m "not slow"`
testpaths = tests
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
# Hard per-test wall-clock timeout — catches infinite retries / hung
# Docker bundles / unmocked HTTP before they cause silent CI hangs.
# 60s leaves headroom for first-time Docker bundling of the AOSS
# index-bootstrap Lambda (~6-8s on warm cache, ~30-40s cold pull).
timeout = 60
