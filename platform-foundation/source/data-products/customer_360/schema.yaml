name: customer_360
kind: product
domain: customer
display_name: "Customer 360"
version: 1.0.0
deterministic_seed: 42
tables:
  - name: customer_360
    storage_format: iceberg
    provenance: cumulative-snapshot
    primary_key: [customer_id, snapshot_date]
    partition_keys: [snapshot_date]
    columns:
      - name: customer_id
        type: string
        nullable: false
        pii: true
        description: "FK -> customers"
        pattern: "^CUST-[0-9A-F]{8}$"
      - name: snapshot_date
        type: date
        nullable: false
        description: "Snapshot date (partition key)"
      - name: full_name
        type: string
        nullable: true
        pii: true
        pii_drift_target: true
        description: "Customer full name (synthetic Faker-generated)"
        edge_case_eligible: true
      - name: email
        type: string
        nullable: true
        pii: true
        pii_drift_target: true
        description: "Email (synthetic)"
        edge_case_eligible: true
      - name: phone
        type: string
        nullable: true
        pii: true
        pii_drift_target: true
        description: "Phone (synthetic)"
        edge_case_eligible: true
      - name: address_line1
        type: string
        nullable: true
        pii: true
        description: "Street address (synthetic)"
      - name: city
        type: string
        nullable: true
        pii: true
        description: "City (synthetic)"
      - name: state
        type: string
        nullable: true
        pii: true
        description: "US state code"
      - name: postal_code
        type: string
        nullable: true
        pii: true
        description: "Postal code (synthetic)"
      - name: country
        type: string
        nullable: false
        description: "ISO 3166-1 alpha-2 country code"
      - name: lifetime_value_usd
        type: decimal
        precision: 12
        scale: 2
        nullable: true
        description: "Cumulative spend with the manufacturer"
      - name: vehicles_owned_count
        type: int
        nullable: false
        description: "Number of VINs in this customer's portfolio"
        range: [0.0, 20.0]
      - name: primary_vin
        type: string
        nullable: true
        description: "Most-used VIN (FK -> vins)"
        pattern: "^[A-HJ-NPR-Z0-9]{17}$"
      - name: customer_segment
        type: string
        nullable: false
        description: "Marketing segment"
        enum_values: [enthusiast, family, fleet, commercial, prospect]
      - name: health_score
        type: double
        nullable: true
        description: "Composite engagement score (0-100)"
        range: [0.0, 100.0]
        edge_case_eligible: true
      - name: churn_probability
        type: double
        nullable: true
        description: "Predicted 90-day churn probability (0-1)"
        range: [0.0, 1.0]
      - name: nps_score
        type: int
        nullable: true
        description: "Most recent Net Promoter Score (-100 to 100)"
        range: [-100.0, 100.0]
      - name: total_charging_sessions_30d
        type: int
        nullable: true
        description: "Charging session count in trailing 30 days"
        range: [0.0, 1000.0]
      - name: total_kwh_consumed_30d
        type: double
        nullable: true
        description: "Energy consumed in trailing 30 days (kWh)"
        range: [0.0, 5000.0]
      - name: opted_in_marketing
        type: boolean
        nullable: false
        description: "Marketing opt-in flag"
      - name: created_at
        type: timestamp
        nullable: false
        description: "Customer record creation time"
      - name: ingest_time
        type: timestamp
        nullable: false
        description: "Snapshot ingest time"
    foreign_keys:
      - column: customer_id
        references_table: customers
        references_column: customer_id
      - column: primary_vin
        references_table: vins
        references_column: vin
