# Secret-scan config consumed by scripts/lib/secret-scan.py during publish.
#
# Loaded via yaml.safe_load. Severity values: critical (blocks publish),
# warning (logs, non-blocking unless --strict).

forbidden_patterns:
  aws_account_id:
    # Excludes: 123456789012 (docs placeholder), 382416733822/404615174143/174872318107
    # (public AWS SageMaker ECR accounts for built-in algorithm containers — us-east-1,
    # us-east-2, us-west-2 respectively; see SageMaker algorithm Docker registry paths docs)
    regex: '\b(?!123456789012\b)(?!382416733822\b)(?!404615174143\b)(?!174872318107\b)\d{12}\b'
    severity: critical
    description: 12-digit AWS account ID (excludes docs placeholder and public SageMaker ECR accounts)

  internal_gitlab:
    regex: 'gitlab\.aws\.dev'
    severity: critical
    description: Internal GitLab hostname

  internal_amazon:
    regex: 'code\.amazon\.com'
    severity: critical
    description: Internal Amazon code-review hostname

  internal_awsi:
    regex: '\b[a-z0-9-]+\.awsi\.aws\.dev'
    severity: critical
    description: Amazon-internal awsi.aws.dev hostname

  slack_internal:
    regex: 'slack\.com/archives/[A-Z0-9]+'
    severity: critical
    description: Internal Slack archive link

  aws_access_key:
    regex: '\b(AKIA|ASIA)[A-Z0-9]{16}\b'
    severity: critical
    description: AWS access key ID prefix

  private_key:
    regex: '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
    severity: critical
    description: Private key material

  internal_email:
    regex: '\b[a-zA-Z0-9._-]+@amazon\.com\b'
    severity: warning
    description: Internal Amazon email address (warning — author commits typically catch these)

forbidden_strings:
  # MMT (Middle Mile Team) project codename — canary blocks reintroduction
  - MMT
  - mmt
  - 'Middle Mile'
  - 'middle mile'
  - 'middle-mile'

  # Internal Amazon hostnames
  - design-inspector.a2z.com
  - w.amazon.com
  - .a2z.com
  - midway.amazon.com

  # Amazon Logistics short code
  - amzl

  # Brazil package definition keyword (Amazon-internal build system)
  - 'package.MMTPredictiveMaintenance'

  # Working-tree author email
  - givenand

scan_exclude:
  # Binaries and assets
  - "*.parquet"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.ico"
  - "*.woff"
  - "*.woff2"
  - "*.ttf"
  - "*.otf"
  # Vendored / third-party
  - "**/node_modules/**"
  - "**/.yarn/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/.git/**"
  # Per-developer state
  - "**/.venv/**"
  - "**/cdk.out/**"
  - "cdk.context.json"
  # The scanner self-references for documentation
  - "scripts/lib/secret-scan.py"
  - "scripts/lib/test_secret_scan.py"
  - ".publish-secrets-scan.yml"
  # Files that necessarily contain canary patterns by design
  - ".gitignore"
  - ".publish-exclude"
  - "CODE_OF_CONDUCT.md"
  - "CONTRIBUTING.md"
  # Test fixtures intentionally containing canary strings
  - "**/test_secret_scan.py"
  - "**/tests/fixtures/**"
